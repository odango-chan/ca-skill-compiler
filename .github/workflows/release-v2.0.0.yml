name: CA Skill Compiler v2.0.0 official release

# One-time bootstrap: merging this workflow to main triggers the release.
# Reruns and workflow_dispatch always use the approved, pinned source commit.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v2.0.0.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ca-skill-compiler-v2.0.0-release
  cancel-in-progress: false

jobs:
  publish:
    name: Validate, build, publish, and verify v2.0.0
    if: github.repository == 'odango-chan/ca-skill-compiler' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APPROVED_SHA: 5f2ab5b1cc9710269ecdfa8f9b73a90162d4d47c
      TAG: v2.0.0
      GOWORK: "off"
      CGO_ENABLED: "0"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact approved Compiler source
        uses: actions/checkout@v4
        with:
          ref: 5f2ab5b1cc9710269ecdfa8f9b73a90162d4d47c
          fetch-depth: 0

      - name: Confirm source identity and published-version boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(grep -Eo 'const CompilerVersion = "v2.0.0"' internal/compiler/version.go)" = 'const CompilerVersion = "v2.0.0"'
          echo "Approved release source: $APPROVED_SHA"
          echo "Historical v1.0.0 tags/releases will not be modified."

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install headless Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Full Go test suite
        run: go test ./... -count=1

      - name: Go vet
        run: go vet ./...

      - name: CGO-free Native build smoke test
        run: go build ./...

      - name: CLI end-to-end
        run: go test ./cmd/skillc -count=1 -run TestCLIEndToEnd -v

      - name: Real Chromium Worker parity
        env:
          CHROMIUM_PARITY: "1"
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: go test ./internal/parity -count=1 -run TestChromiumWorkerParity -v

      - name: Diff whitespace check
        run: git diff --check

      - name: Build all official release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/skillc-v2.0.0-linux-amd64 ./cmd/skillc
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -o dist/skillc-v2.0.0-darwin-amd64 ./cmd/skillc
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o dist/skillc-v2.0.0-darwin-arm64 ./cmd/skillc
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o dist/skillc-v2.0.0-windows-amd64.exe ./cmd/skillc
          CGO_ENABLED=0 GOOS=js GOARCH=wasm go build -trimpath -o dist/skillc-v2.0.0.wasm ./cmd/skillc-wasm
          test -s dist/skillc-v2.0.0-linux-amd64
          test -s dist/skillc-v2.0.0-darwin-amd64
          test -s dist/skillc-v2.0.0-darwin-arm64
          test -s dist/skillc-v2.0.0-windows-amd64.exe
          test -s dist/skillc-v2.0.0.wasm
          (cd dist && sha256sum skillc-v2.0.0-* skillc-v2.0.0.wasm > SHA256SUMS && sha256sum -c SHA256SUMS)
          echo "Official release build complete at $APPROVED_SHA"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-v2.0.0.md <<'EOF'
          # CA Skill Compiler v2.0.0

          **Release source:** `5f2ab5b1cc9710269ecdfa8f9b73a90162d4d47c`
          
          **Language target:** CA-SL v1alpha5 (`connectionagent.io/v1alpha5`).

          - A single Go Compiler Core supports the native CLI and Go/WASM Worker.
          - Removes the v1alpha4 build, CLI, and artifact compatibility paths.
          - Implements the complete Compiler-owned static CA-SL v1alpha5 scope, including inherited Package/Contract/Predicate, Tool/Capability/Owner linking, Schema/CEL, Procedure Graph, SourcePath, Evidence, Mutation/Reconcile/retry, and Wait/Ingress linking.
          - Ships FROZEN BuildRequest, BuildResult, DependencyInspection, and Artifact Manifest v1alpha5 contracts.
          - Compiled artifacts are deterministic, self-verifiable, and use canonical RFC 8785 JCS serialization.

          **Breaking change:** `connectionagent.io/v1alpha4` is no longer an accepted build target. Update API versions, inputs, and projects to v1alpha5.

          **Validation:** This release is gated on Go unit tests, vet, CGO-free build, CLI end-to-end, and real Chromium Worker parity executed by this workflow. Production Owner/Deployment/Host/Runtime/5GC/MAS qualification remains NOT_QUALIFIED.

          **Assets:** Native CLI for Linux amd64, macOS amd64/arm64, Windows amd64; Go/WASM module; SHA256SUMS. Verify downloaded assets with `sha256sum -c SHA256SUMS`.

          **Historical release:** v1.0.0 remains unchanged.
          EOF

      - name: Create or verify the annotated v2.0.0 tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG" || true
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-parse "$TAG^{commit}")" = "$APPROVED_SHA" || {
              echo "ERROR: existing $TAG points to an unapproved commit" >&2
              exit 1
            }
            echo "Existing tag has the approved source identity; will not rewrite it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$APPROVED_SHA" -m "CA Skill Compiler v2.0.0"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish GitHub Release with six release assets
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing release detected; no assets will be overwritten."
          else
            gh release create "$TAG" \
              dist/skillc-v2.0.0-linux-amd64 \
              dist/skillc-v2.0.0-darwin-amd64 \
              dist/skillc-v2.0.0-darwin-arm64 \
              dist/skillc-v2.0.0-windows-amd64.exe \
              dist/skillc-v2.0.0.wasm \
              dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "CA Skill Compiler v2.0.0" \
              --notes-file /tmp/release-v2.0.0.md
          fi

      - name: Independently download and verify published assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-download
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir /tmp/release-download
          (
            cd /tmp/release-download
            for name in skillc-v2.0.0-linux-amd64 skillc-v2.0.0-darwin-amd64 skillc-v2.0.0-darwin-arm64 skillc-v2.0.0-windows-amd64.exe skillc-v2.0.0.wasm SHA256SUMS; do
              test -s "$name" || { echo "Missing release asset $name" >&2; exit 1; }
            done
            sha256sum -c SHA256SUMS
          )
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,url,isDraft,isPrerelease,assets \
            --jq '{tag: .tagName, url: .url, draft: .isDraft, prerelease: .isPrerelease, assets: [.assets[].name]}'
