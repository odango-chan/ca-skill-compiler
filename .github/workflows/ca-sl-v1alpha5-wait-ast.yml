name: CA-SL v1alpha5 Wait AST + Procedure admission (candidate)

on:
  pull_request:
    branches: [main]
    paths:
      - "internal/compiler/**"
      - ".github/workflows/ca-sl-v1alpha5-wait-ast.yml"
  push:
    branches:
      - feat/compiler-v1alpha5-wait-ast-20261117
    paths:
      - "internal/compiler/**"
      - ".github/workflows/ca-sl-v1alpha5-wait-ast.yml"

permissions:
  contents: read

jobs:
  wait-ast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache: true
      - name: Focused v1alpha5 Wait/Procedure tests
        run: GOWORK=off go test ./internal/compiler -run 'V1Alpha5' -count=1 -v
      - name: Full Go test suite
        run: GOWORK=off go test ./... -count=1
      - name: Go vet
        run: GOWORK=off go vet ./...
      - name: Native build without CGo
        run: CGO_ENABLED=0 GOWORK=off go build ./...
      - name: Go/WASM build without CGo
        run: CGO_ENABLED=0 GOOS=js GOARCH=wasm GOWORK=off go build -o /tmp/skillc-v1alpha5-wait.wasm ./cmd/skillc-wasm
