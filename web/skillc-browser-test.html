<!doctype html>
<meta charset="utf-8">
<title>skillc WASM smoke test</title>
<pre id="result">RUNNING</pre>
<script>
const output = document.querySelector('#result');
const worker = new Worker('./skillc-worker.js');
worker.onerror = event => { output.textContent = `WORKER ERROR: ${event.message}`; document.documentElement.dataset.test = 'fail'; };
worker.onmessageerror = () => { output.textContent = 'WORKER MESSAGE ERROR'; document.documentElement.dataset.test = 'fail'; };
const paths = [
  'skills/normalize/SKILL.md', 'skills/normalize/assurance/contract.yaml', 'skills/normalize/assurance/procedure.yaml',
  'skills/normalize/schemas/normalize-request.schema.yaml', 'skills/normalize/scripts/normalize.py',
  'lib/tools/demo.tool.yaml'
];
async function loadFiles() { return Promise.all(paths.map(async path => {
  const response = await fetch(`./project/${path}`);
  if (!response.ok) throw new Error(`Unable to fetch ${path}`);
  const bytes = new Uint8Array(await response.arrayBuffer());
  let binary = ''; for (const byte of bytes) binary += String.fromCharCode(byte);
  return {path, bytes:btoa(binary)};
})); }
async function loadDiagnosticGolden() {
  const response = await fetch('./diagnostics-golden.json');
  if (!response.ok) throw new Error('Unable to fetch Native diagnostic golden vectors');
  return response.json();
}
function encodeUTF8(text) {
  const bytes = new TextEncoder().encode(text);
  let binary = ''; for (const byte of bytes) binary += String.fromCharCode(byte);
  return btoa(binary);
}
let nextId = 0;
function send(command, request) {
  const id = `r${++nextId}`;
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error(`${command} timed out`)), 45000);
    const listener = event => {
      if (event.data?.id !== id) return;
      clearTimeout(timer); worker.removeEventListener('message', listener);
      if (event.data.error) reject(new Error(event.data.error)); else resolve(event.data.result);
    };
    worker.addEventListener('message', listener);
    worker.postMessage({id, command, request});
  });
}
(async () => {
  const files = await loadFiles();
  const diagnosticGolden = await loadDiagnosticGolden();
  const request = {files};
  const check = await send('check', request);
  const build = await send('build', request);
  const inspect = await send('inspect', request);
  const invalid = await send('check', {files, targets:['missing']});
  const badBindingFiles = files.map(file => ({...file}));
  const procedure = badBindingFiles.find(file => file.path === 'skills/normalize/assurance/procedure.yaml');
  const procedureBytes = Uint8Array.from(atob(procedure.bytes), ch => ch.charCodeAt(0));
  let procedureText = new TextDecoder().decode(procedureBytes);
  procedureText = procedureText.replace('          key: {from: context.request.dnn}', '          unexpected: {value: sample}');
  if (procedureText === new TextDecoder().decode(procedureBytes)) throw new Error('negative binding fixture mutation failed');
  procedure.bytes = encodeUTF8(procedureText);
  const invalidBinding = await send('check', {files:badBindingFiles});
  if (!check.success || !build.success || build.outputFiles.length !== 7) throw new Error('valid build/check failed');
  const expectedPaths = [
    'lib/tools/demo.tool.yaml',
    'skills/normalize/SKILL.md',
    'skills/normalize/assurance/contract.yaml',
    'skills/normalize/assurance/procedure.yaml',
    'skills/normalize/schemas/generated/normalize.output.schema.json',
    'skills/normalize/schemas/normalize-request.schema.yaml',
    'skills/normalize/scripts/normalize.py'
  ];
  if (JSON.stringify(build.outputFiles.map(f=>f.path)) !== JSON.stringify(expectedPaths)) throw new Error('output paths/order differ from native fixture expectation');
  for (const file of build.outputFiles) {
    const response = await fetch(`./native-output/${file.path}`);
    if (!response.ok) throw new Error(`Native golden output is missing: ${file.path}`);
    const bytes = new Uint8Array(await response.arrayBuffer());
    let binary = ''; for (const byte of bytes) binary += String.fromCharCode(byte);
    if (btoa(binary) !== file.bytes) throw new Error(`WASM output bytes differ from Native: ${file.path}`);
  }
  if (check.diagnostics.length !== 0) throw new Error('valid project returned diagnostics');
  if (!Array.isArray(inspect.tools) || inspect.tools.length !== 1 || inspect.tools[0].operationId !== 'demo.read') throw new Error('inspectLibraries response malformed');
  if (invalid.success || JSON.stringify(invalid.diagnostics) !== JSON.stringify(diagnosticGolden.targetNotFound)) throw new Error(`WASM diagnostics differ from Native TARGET_NOT_FOUND golden: ${JSON.stringify(invalid.diagnostics)}`);
  if (invalidBinding.success || JSON.stringify(invalidBinding.diagnostics) !== JSON.stringify(diagnosticGolden.invalidBinding)) throw new Error(`WASM diagnostics differ from Native binding golden: ${JSON.stringify(invalidBinding.diagnostics)}`);
  output.textContent = JSON.stringify({status:'PASS', check, build:build.outputFiles.map(f=>f.path), inspect, invalid:invalid.diagnostics, invalidBinding:invalidBinding.diagnostics}, null, 2);
  document.documentElement.dataset.test = 'pass';
})().catch(error => {
  output.textContent = `FAIL: ${error.stack || error}`;
  document.documentElement.dataset.test = 'fail';
});
</script>
