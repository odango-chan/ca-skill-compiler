<!doctype html>
<meta charset="utf-8">
<title>Skill Studio · Compiler Worker Integration (read-only)</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 1.5rem; color: #1f2328; }
  h1 { font-size: 1.15rem; }
  .status { font-weight: 600; }
  table { border-collapse: collapse; margin-top: .5rem; }
  th, td { border: 1px solid #d0d7de; padding: .25rem .5rem; text-align: left; }
  .artifact { font-family: ui-monospace, monospace; }
  .muted { color: #57606a; }
  #artifact-view { white-space: pre-wrap; font-family: ui-monospace, monospace; border: 1px solid #d0d7de; padding: .5rem; min-height: 2rem; }
</style>
<h1>Skill Studio · Compiler Worker Integration</h1>
<p class="muted">Read-only consumer of the unified Compiler Worker result. Studio owns UI; it must not reimplement parsing, schema validation or procedure linking.</p>
<p class="status" id="status">RUNNING</p>
<table id="diagnostics">
  <thead><tr><th>Code</th><th>Phase</th><th>Path</th><th>Line</th><th>Column</th><th>Message</th></tr></thead>
  <tbody></tbody>
</table>
<h2>Artifact (read-only)</h2>
<ul id="artifacts"></ul>
<div id="artifact-view" aria-readonly="true"></div>
<script>
const worker = new Worker('./skillc-worker.js');
let nextId = 1;
const pending = new Map();
worker.onmessage = event => {
  const { id, result, error } = event.data ?? {};
  const entry = pending.get(id);
  if (!entry) return;
  pending.delete(id);
  if (error) entry.reject(new Error(error)); else entry.resolve(result);
};
worker.onerror = event => { for (const entry of pending.values()) entry.reject(new Error(event.message)); pending.clear(); };
function call(command, request) {
  const id = nextId++;
  return new Promise((resolve, reject) => {
    pending.set(id, { resolve, reject });
    worker.postMessage({ id, command, request });
  });
}
function text(value) { return value === undefined || value === null ? '' : String(value); }
function renderDiagnostics(diagnostics) {
  const body = document.querySelector('#diagnostics tbody');
  body.textContent = '';
  for (const diagnostic of diagnostics) {
    const row = document.createElement('tr');
    for (const [field, value] of [
      ['code', diagnostic.code], ['phase', diagnostic.phase],
      ['path', diagnostic.path], ['line', diagnostic.line],
      ['column', diagnostic.column], ['message', diagnostic.message],
    ]) {
      const cell = document.createElement('td');
      cell.dataset.field = field;
      cell.textContent = text(value);
      row.appendChild(cell);
    }
    body.appendChild(row);
  }
}
function renderArtifact(files) {
  const list = document.querySelector('#artifacts');
  const view = document.querySelector('#artifact-view');
  list.textContent = '';
  view.textContent = files.length === 0 ? '(no artifact files: build failed closed)' : '';
  for (const file of files) {
    const item = document.createElement('li');
    item.className = 'artifact';
    item.dataset.path = file.path;
    item.textContent = file.path;
    item.addEventListener('click', () => { view.textContent = file.bytes; });
    list.appendChild(item);
  }
}
(async () => {
  try {
    const requestName = new URLSearchParams(location.search).get('request') || 'parity-request.json';
    const request = await (await fetch('./' + requestName)).json();
    const check = await call('check', request);
    const build = await call('build', request);
    const inspect = await call('inspect', request);
    renderDiagnostics(build.diagnostics ?? check ?? []);
    renderArtifact(build.outputFiles ?? []);
    document.querySelector('#status').textContent = `Build success: ${build.success} · diagnostics: ${(build.diagnostics ?? []).length} · inspect callables: ${inspect.callables ? inspect.callables.length : 0} · status: NOT_QUALIFIED`;
    window.__studio = {
      ok: true,
      buildSuccess: build.success,
      diagnostics: (build.diagnostics ?? []).map(diagnostic => ({
        code: diagnostic.code, phase: diagnostic.phase, path: diagnostic.path,
        line: diagnostic.line ?? 0, column: diagnostic.column ?? 0,
      })),
      artifactPaths: (build.outputFiles ?? []).map(file => file.path),
      artifactReadOnly: document.querySelector('#artifact-view').getAttribute('aria-readonly') === 'true',
      renderedRows: document.querySelectorAll('#diagnostics tbody tr').length,
      reimplementedParser: false,
    };
  } catch (error) {
    document.querySelector('#status').textContent = `ERROR: ${error && error.message ? error.message : error}`;
    window.__studio = { ok: false, error: String(error && error.message ? error.message : error) };
  }
  document.documentElement.dataset.studio = window.__studio.ok ? 'done' : 'error';
})();
</script>
