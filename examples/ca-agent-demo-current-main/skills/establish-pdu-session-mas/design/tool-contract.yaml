# Proposed Agent-facing ToolCatalog for the MAS establishment Skill.
# NOT_READY: external MAS adapters, field-level outputs, independent Effect contracts,
# reconcile-result contracts and resource-owner proofs remain unimplemented.
# The stateRef is an attested, immutable Agent-side projection of exact MAS outputs;
# it is not an arbitrary dictionary or permission to infer missing MAS fields.
apiVersion: ca-agent-demo.tool/v1
kind: ToolCatalog
metadata:
  name: pdu-session-mas
  owner: ca-agent-demo
x-common:
  ref: &ref
    type: string
    minLength: 1
    maxLength: 512
  psi: &psi
    type: integer
    minimum: 1
    maximum: 15
  pti: &pti
    type: integer
    minimum: 1
    maximum: 254
  requestType: &requestType
    type: integer
    const: 1
  dnn: &dnn
    type: string
    pattern: ^[a-z0-9][a-z0-9.-]*$
  slice: &slice
    type: object
    additionalProperties: false
    required: [sst]
    properties:
      sst: {type: integer, minimum: 0, maximum: 255}
      sd: {type: integer, minimum: 0, maximum: 16777214}
  plmn: &plmn
    type: object
    additionalProperties: false
    required: [mcc, mnc]
    properties:
      mcc: {type: string, pattern: '^[0-9]{3}$'}
      mnc: {type: string, pattern: '^[0-9]{2,3}$'}
  ipv4: &ipv4
    type: string
    const: IPV4
  ssc1: &ssc1
    type: integer
    const: 1
  int0: &int0
    type: integer
    const: 0
  localPool: &localPool
    type: string
    const: LOCAL_POOL
  defaultRating: &defaultRating
    type: string
    const: default
  establishedEvent: &establishedEvent
    type: string
    const: ESTABLISHED
  opaque: &opaque {}
spec:
  contracts:
  - operation: ca.pdu_session.subscription.validate
    adapter: smf-mas
    effect: MUTATION
    inputSchema:
      type: object
      additionalProperties: false
      required: [ueRef, ingressRef, lifecycleRef, pduSessionId, pti, requestType, dnn, sNssai, servingPlmn, requestedPduSessionType, requestedSscMode]
      properties:
        ueRef: *ref
        ingressRef: *ref
        lifecycleRef: *ref
        pduSessionId: *psi
        pti: *pti
        requestType: *requestType
        dnn: *dnn
        sNssai: *slice
        servingPlmn: *plmn
        requestedPduSessionType: *ipv4
        requestedSscMode: *ssc1
    outputSchema:
      type: object
      additionalProperties: false
      required: [operationRef, stateRef, sub_summary]
      properties:
        operationRef: *ref
        stateRef: *ref
        sub_summary: *opaque
  - operation: ca.pdu_session.secondary_auth.disposition
    adapter: smf-mas
    effect: MUTATION
    inputSchema:
      type: object
      additionalProperties: false
      required: [ueRef, ingressRef, lifecycleRef, pduSessionId, pti, requestType, dnn, sNssai, servingPlmn, requestedPduSessionType, requestedSscMode, subscriptionStateRef, required]
      properties:
        ueRef: *ref
        ingressRef: *ref
        lifecycleRef: *ref
        pduSessionId: *psi
        pti: *pti
        requestType: *requestType
        dnn: *dnn
        sNssai: *slice
        servingPlmn: *plmn
        requestedPduSessionType: *ipv4
        requestedSscMode: *ssc1
        subscriptionStateRef: *ref
        required: *int0
    outputSchema:
      type: object
      additionalProperties: false
      required: [operationRef, stateRef, phase]
      properties:
        operationRef: *ref
        stateRef: *ref
        phase: *opaque
  - operation: ca.pdu_session.context.create
    adapter: smf-mas
    effect: MUTATION
    inputSchema:
      type: object
      additionalProperties: false
      required: [ueRef, ingressRef, lifecycleRef, pduSessionId, pti, requestType, dnn, sNssai, servingPlmn, requestedPduSessionType, requestedSscMode, subscriptionStateRef, authStateRef, subSummary]
      properties:
        ueRef: *ref
        ingressRef: *ref
        lifecycleRef: *ref
        pduSessionId: *psi
        pti: *pti
        requestType: *requestType
        dnn: *dnn
        sNssai: *slice
        servingPlmn: *plmn
        requestedPduSessionType: *ipv4
        requestedSscMode: *ssc1
        subscriptionStateRef: *ref
        authStateRef: *ref
        subSummary: *opaque
    outputSchema:
      type: object
      additionalProperties: false
      required: [operationRef, stateRef, session_keys, sm_context_ref]
      properties:
        operationRef: *ref
        stateRef: *ref
        session_keys: *opaque
        sm_context_ref: *ref
  - operation: ca.pdu_session.uecm.register
    adapter: smf-mas
    effect: MUTATION
    inputSchema:
      type: object
      additionalProperties: false
      required: [ueRef, ingressRef, lifecycleRef, pduSessionId, pti, requestType, dnn, sNssai, servingPlmn, requestedPduSessionType, requestedSscMode, contextStateRef, sessionKeys]
      properties:
        ueRef: *ref
        ingressRef: *ref
        lifecycleRef: *ref
        pduSessionId: *psi
        pti: *pti
