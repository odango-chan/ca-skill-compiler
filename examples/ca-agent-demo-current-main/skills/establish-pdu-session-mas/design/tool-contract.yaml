  - operation: ca.pdu_session.policy.update
    adapter: smf-mas
    effect: MUTATION
    inputSchema:
      type: object
      additionalProperties: false
      required: [ueRef, ingressRef, lifecycleRef, pduSessionId, pti, requestType, dnn, sNssai, servingPlmn, requestedPduSessionType, requestedSscMode, contextStateRef, policyStateRef, addressStateRef, sessionKeys, ueAddress, policyAssociationId]
      properties:
        ueRef: *ref
        ingressRef: *ref
        lifecycleRef: *ref
        pduSessionId: *psi
