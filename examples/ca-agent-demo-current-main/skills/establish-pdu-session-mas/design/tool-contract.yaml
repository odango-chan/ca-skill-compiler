        dnn: *dnn
        sNssai: *slice
        servingPlmn: *plmn
        requestedPduSessionType: *ipv4
        requestedSscMode: *ssc1
        contextStateRef: *ref
        policyStateRef: *ref
        addressStateRef: *ref
        sessionKeys: *opaque
        ueAddress: *opaque
        policyAssociationId: *opaque
    outputSchema:
      type: object
      additionalProperties: false
      required: [operationRef, stateRef, up_intent, authorized_qos, policy_assoc_id]
      properties:
        operationRef: *ref
        stateRef: *ref
        up_intent: *opaque
        authorized_qos: *opaque
        policy_assoc_id: *opaque
  - operation: ca.pdu_session.charging.create
    adapter: smf-mas
    effect: MUTATION
    inputSchema:
      type: object
