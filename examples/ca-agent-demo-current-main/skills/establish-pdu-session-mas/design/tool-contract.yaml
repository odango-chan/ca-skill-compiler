        dnn: *dnn
        sNssai: *slice
        servingPlmn: *plmn
        requestedPduSessionType: *ipv4
        requestedSscMode: *ssc1
        contextStateRef: *ref
        sessionKeys: *opaque
    outputSchema:
      type: object
      additionalProperties: false
      required: [operationRef, stateRef, uecm_registered]
      properties:
        operationRef: *ref
        stateRef: *ref
        uecm_registered: *opaque
  - operation: ca.pdu_session.policy.create
    adapter: smf-mas
    effect: MUTATION
    inputSchema:
      type: object
      additionalProperties: false
      required: [ueRef, ingressRef, lifecycleRef, pduSessionId, pti, requestType, dnn, sNssai, servingPlmn, requestedPduSessionType, requestedSscMode, contextStateRef, subscriptionStateRef, sessionKeys]
      properties:
        ueRef: *ref
        ingressRef: *ref
        lifecycleRef: *ref
        pduSessionId: *psi
        pti: *pti
        requestType: *requestType
        dnn: *dnn
        sNssai: *slice
        servingPlmn: *plmn
        requestedPduSessionType: *ipv4
        requestedSscMode: *ssc1
        contextStateRef: *ref
        subscriptionStateRef: *ref
        sessionKeys: *opaque
    outputSchema:
      type: object
      additionalProperties: false
      required: [operationRef, stateRef, up_intent, authorized_qos, policy_assoc_id]
      properties:
        operationRef: *ref
        stateRef: *ref
        up_intent: *opaque
        authorized_qos: *opaque
        policy_assoc_id: *opaque
  - operation: ca.pdu_session.anchor.select
    adapter: smf-mas
    effect: MUTATION
    inputSchema:
      type: object
      additionalProperties: false
      required: [ueRef, ingressRef, lifecycleRef, pduSessionId, pti, requestType, dnn, sNssai, servingPlmn, requestedPduSessionType, requestedSscMode, policyStateRef]
      properties:
        ueRef: *ref
        ingressRef: *ref
        lifecycleRef: *ref
        pduSessionId: *psi
        pti: *pti
        requestType: *requestType
        dnn: *dnn
        sNssai: *slice
        servingPlmn: *plmn
        requestedPduSessionType: *ipv4
        requestedSscMode: *ssc1
        policyStateRef: *ref
    outputSchema:
      type: object
      additionalProperties: false
      required: [operationRef, stateRef, up_anchor]
      properties:
        operationRef: *ref
        stateRef: *ref
        up_anchor: *opaque
  - operation: ca.pdu_session.address.allocate
    adapter: smf-mas
    effect: MUTATION
    inputSchema:
      type: object
      additionalProperties: false
      required: [ueRef, ingressRef, lifecycleRef, pduSessionId, pti, requestType, dnn, sNssai, servingPlmn, requestedPduSessionType, requestedSscMode, anchorStateRef, allocator, upAnchor]
      properties:
        ueRef: *ref
        ingressRef: *ref
        lifecycleRef: *ref
        pduSessionId: *psi
        pti: *pti
        requestType: *requestType
        dnn: *dnn
        sNssai: *slice
        servingPlmn: *plmn
        requestedPduSessionType: *ipv4
