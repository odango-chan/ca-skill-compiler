procedures:
  normalize:
    start: read
    nodes:
      read:
        call: demo.read
        with:
          key: {from: context.request.dnn}
        'on':
          SUCCEEDED: normalize-step
          FAILED: failed
      normalize-step:
        preconditions:
          steps:
            - name: normalize-value
              script: scripts/normalize.py
              with:
                value: {from: read.output.value}
        terminal: SUCCEEDED
      failed:
        terminal: FAILED
