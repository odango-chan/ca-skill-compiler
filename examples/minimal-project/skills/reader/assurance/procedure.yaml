procedures:
  read-and-store:
    start: fetch
    nodes:
      fetch:
        call: demo.read
        with:
          key: {value: sample}
        'on':
          SUCCEEDED: child
          FAILED: failed
      child:
        procedure:
          skill: writer
          procedure: write
        'on':
          SUCCEEDED: done
      failed: {terminal: FAILED}
      done: {terminal: SUCCEEDED}
